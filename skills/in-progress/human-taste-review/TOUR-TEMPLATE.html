<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tour</title>

<script type="application/json" id="tour-data">
{
  "repo": "wandb/core",
  "pr": 4821,
  "headline": "The backfill sensor stops seeing its own runs",
  "whyMissing": false,
  "stations": [
    {
      "title": "Why this change",
      "narration": [
        "The sensor that kicks off downstream work stopped firing whenever a partition was backfilled overnight.",
        "Nobody noticed for three days, because nothing failed. The run simply never appeared.",
        "The cause is a falsy check on a list that comes back empty in the normal case."
      ],
      "excerpt": {
        "label": "the guard that misreads an empty list",
        "file": "sensors/backfill.py",
        "code": "-    if not runs:\n-        return SkipReason(\"no runs yet\")\n+    if runs is None:\n+        return SkipReason(\"run store unavailable\")"
      }
    },
    {
      "title": "What moved",
      "narration": [
        "One guard changed, in the shared helper rather than in each of the four callers.",
        "The skip reason got more specific, so the next person reading the sensor log can tell an empty result from a missing store."
      ]
    },
    {
      "title": "How it holds",
      "narration": [
        "A single test covers the case that broke: an empty run list now proceeds instead of skipping.",
        "The three sibling sensors route through the same helper, so they are fixed by the same line."
      ],
      "excerpt": {
        "label": "the test that fails if this regresses",
        "file": "tests/test_backfill_sensor.py",
        "code": "+def test_empty_run_list_does_not_skip():\n+    assert evaluate(runs=[]) is not None"
      }
    }
  ]
}
</script>

<style>
:root {
  --paper:   #EDEFF2;
  --card:    #FFFFFF;
  --ink:     #16202B;
  --ink-soft:#5A6B7C;
  --signal:  #2F5BD0;
  --vitrine: #DDE3E9;
  --rule:    #C9D2DB;

  --display: Optima, "Gill Sans MT", "Gill Sans", Candara, "Trebuchet MS", system-ui, sans-serif;
  --text:    Charter, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --mono:    "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;

  --measure: 62ch;
  --rail-w:  clamp(3.5rem, 7vw, 5.5rem);
  --column:  calc(var(--measure) + var(--rail-w) + 3rem);
}

@media (prefers-color-scheme: dark) {
  :root {
    --paper:#131A22; --card:#1B242E; --ink:#E4E9EE;
    --ink-soft:#94A5B5; --signal:#7CA0F0; --vitrine:#26323E; --rule:#33414F;
  }
}

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--text);
  font-size: 1.1875rem;
  line-height: 1.65;
}

/* ---- masthead ------------------------------------------------ */

.masthead {
  padding: clamp(2.5rem, 7vh, 5rem) 1.5rem 0 var(--rail-w);
  max-width: var(--column);
  margin-inline: auto;
}
.masthead .slug {
  font-family: var(--mono);
  font-size: 0.8125rem;
  color: var(--ink-soft);
  letter-spacing: 0.01em;
}
.masthead h1 {
  font-family: var(--display);
  font-weight: 400;
  font-size: clamp(1.9rem, 5.2vw, 2.9rem);
  line-height: 1.12;
  letter-spacing: -0.012em;
  margin: 0.5rem 0 0;
  max-width: 34ch;
}

/* ---- the honesty-rule callout -------------------------------- */

.gap {
  margin: 2.5rem auto 0;
  max-width: var(--measure);
  border-left: 3px solid var(--signal);
  padding: 0.25rem 0 0.25rem 1.25rem;
  color: var(--ink-soft);
  font-size: 1.0625rem;
}
.gap strong { color: var(--ink); font-weight: 600; }

/* ---- rail ---------------------------------------------------- */

.rail {
  position: fixed;
  top: 0; bottom: 0;
  left: max(0px, calc(50vw - var(--column) / 2));
  width: var(--rail-w);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 0.4rem;
  z-index: 2;
}
.rail button {
  position: relative;
  padding: 0.3rem 0.5rem;
  border: 0; background: none;
  cursor: pointer;
  font-family: var(--mono);
  font-size: 0.8125rem;
  line-height: 1;
  color: var(--ink-soft);
  opacity: 0.55;
  transition: color 180ms ease, opacity 180ms ease;
}
.rail button:hover { opacity: 1; }
.rail button[aria-current="true"] { color: var(--signal); opacity: 1; }
.rail button[aria-current="true"]::before {
  content: "";
  position: absolute;
  left: -0.55rem; top: 50%;
  width: 5px; height: 5px;
  margin-top: -2.5px;
  border-radius: 50%;
  background: var(--signal);
}
body.listening .rail button[aria-current="true"]::before {
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--signal) 25%, transparent);
}
.rail button:focus-visible { outline: 2px solid var(--signal); outline-offset: 1px; border-radius: 3px; opacity: 1; }

/* ---- listen control ------------------------------------------ */

.listen {
  position: fixed;
  bottom: 1.75rem;
  right: max(1.5rem, calc(50vw - var(--column) / 2 + 1.5rem));
  z-index: 3;
  display: inline-flex; align-items: center; gap: 0.5rem;
  padding: 0.6rem 1.1rem;
  font-family: var(--display);
  font-size: 0.9375rem;
  letter-spacing: 0.005em;
  color: var(--ink);
  background: var(--card);
  border: 1px solid var(--rule);
  border-radius: 2px;
  box-shadow: 0 1px 2px color-mix(in srgb, var(--ink) 8%, transparent),
              0 6px 18px color-mix(in srgb, var(--ink) 7%, transparent);
  cursor: pointer;
  transition: color 160ms ease, border-color 160ms ease;
}
.listen:hover { border-color: var(--ink-soft); }
.listen:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
.listen .glyph { font-size: 0.75rem; line-height: 1; }
body.listening .listen { color: var(--signal); border-color: var(--signal); }
.listen[hidden] { display: none; }

/* ---- stations ------------------------------------------------ */

.station {
  position: relative;
  min-height: 82vh;
  padding: clamp(3rem, 9vh, 7rem) 1.5rem clamp(3rem, 9vh, 7rem) var(--rail-w);
  max-width: var(--column);
  margin-inline: auto;
}
.station h2 {
  font-family: var(--display);
  font-weight: 400;
  font-size: clamp(1.5rem, 3.6vw, 2.1rem);
  line-height: 1.18;
  letter-spacing: -0.008em;
  margin: 0 0 1.75rem;
  max-width: 30ch;
}

.card {
  position: relative;
  max-width: var(--measure);
}
/* the one piece of motion: narration progress across the top edge */
.card::before {
  content: "";
  position: absolute;
  top: -0.9rem; left: 0; right: 0;
  height: 2px;
  background: var(--signal);
  transform: scaleX(var(--p, 0));
  transform-origin: left;
  opacity: 0;
  transition: transform 220ms linear, opacity 220ms ease;
}
.station[aria-current="true"] .card::before { opacity: 1; }
body:not(.listening) .card::before { opacity: 0; }

.narration { margin: 0; }
.narration .s { transition: color 220ms ease; }
body.listening .narration .s { color: var(--ink-soft); }
body.listening .narration .s.speaking { color: var(--ink); }

/* ---- excerpt: native disclosure ------------------------------ */

details.excerpt { margin-top: 2rem; max-width: var(--measure); }
details.excerpt > summary {
  display: flex; align-items: baseline; gap: 0.5rem;
  cursor: pointer;
  list-style: none;
  font-family: var(--display);
  font-size: 0.9375rem;
  color: var(--signal);
  padding: 0.3rem 0;
}
details.excerpt > summary::-webkit-details-marker { display: none; }
details.excerpt > summary .tri { font-size: 0.875rem; line-height: 1.3; transition: transform 160ms ease; }
details.excerpt[open] > summary .tri { transform: rotate(90deg); }
details.excerpt > summary:focus-visible { outline: 2px solid var(--signal); outline-offset: 3px; }

.vitrine {
  margin-top: 0.75rem;
  background: var(--vitrine);
  border-radius: 2px;
  overflow: hidden;
}
.vitrine .file {
  font-family: var(--mono);
  font-size: 0.75rem;
  color: var(--ink-soft);
  padding: 0.6rem 1rem;
  border-bottom: 1px solid color-mix(in srgb, var(--ink-soft) 25%, transparent);
}
.vitrine pre {
  margin: 0;
  padding: 0.9rem 1rem 1.1rem;
  overflow-x: auto;
  font-family: var(--mono);
  font-size: 0.8125rem;
  line-height: 1.6;
  color: var(--ink);
}
.vitrine pre .add { color: #1F7A43; }
.vitrine pre .del { color: #A32B2B; }
@media (prefers-color-scheme: dark) {
  .vitrine pre .add { color: #6BD397; }
  .vitrine pre .del { color: #F08C8C; }
}

/* ---- end ----------------------------------------------------- */

.end {
  padding: 2rem 1.5rem clamp(4rem, 14vh, 9rem) var(--rail-w);
  max-width: var(--column);
  margin-inline: auto;
}
.end a {
  font-family: var(--display);
  font-size: 0.9375rem;
  color: var(--signal);
}

/* ---- quality floor ------------------------------------------- */

@media (max-width: 34rem) {
  :root { --rail-w: 2.5rem; }
  body { font-size: 1.0625rem; }
  .listen { bottom: 1rem; right: 1rem; }
  .rail { flex-direction: row; top: 0; bottom: auto; left: 0 !important;
          width: 100%; height: 2.5rem; justify-content: center;
          gap: 0.15rem; background: var(--paper); }
  .rail button[aria-current="true"]::before { display: none; }
  .masthead { padding-top: 4rem; }
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { transition-duration: 0.01ms !important; }
}
</style>
</head>
<body>

<nav class="rail" id="rail" aria-label="Stations"></nav>

<button class="listen" id="listen" hidden aria-pressed="false">
  <span class="glyph" id="listen-glyph" aria-hidden="true">&#9654;</span>
  <span id="listen-label">Listen</span>
</button>

<header class="masthead">
  <div class="slug" id="slug"></div>
  <h1 id="headline"></h1>
</header>

<div id="gap-slot"></div>
<main id="stations"></main>

<footer class="end">
  <a id="pr-link" href="#">Open the pull request on GitHub</a>
</footer>

<script>
"use strict";

const data = JSON.parse(document.getElementById("tour-data").textContent);
const stations = data.stations || [];

/* ---------- render ------------------------------------------- */

const prUrl = data.url || `https://github.com/${data.repo}/pull/${data.pr}`;
document.getElementById("slug").textContent = `${data.repo} #${data.pr}`;
document.getElementById("headline").textContent = data.headline || "";
document.getElementById("pr-link").href = prUrl;
document.title = `${data.repo} #${data.pr} — tour`;

if (data.whyMissing) {
  document.getElementById("gap-slot").innerHTML =
    '<p class="gap"><strong>This pull request does not say why it exists.</strong> ' +
    'Nothing in the description, the commits, or a linked issue explains the motivation. ' +
    'The stations below describe what changed; the reason is yours to ask for.</p>';
}

const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

const diffLine = (line) => {
  const cls = line.startsWith("+") ? "add" : line.startsWith("-") ? "del" : "";
  return cls ? `<span class="${cls}">${esc(line)}</span>` : esc(line);
};

const stationsEl = document.getElementById("stations");
const railEl = document.getElementById("rail");

stations.forEach((st, i) => {
  const sec = document.createElement("section");
  sec.className = "station";
  sec.id = `station-${i}`;
  sec.setAttribute("aria-labelledby", `h-${i}`);

  const sentences = (st.narration || [])
    .map((s, j) => `<span class="s" data-s="${j}">${esc(s)}</span>`)
    .join(" ");

  let excerpt = "";
  if (st.excerpt) {
    const ex = st.excerpt;
    excerpt =
      `<details class="excerpt">` +
        `<summary><span class="tri" aria-hidden="true">&#9656;</span>${esc(ex.label || "the changed lines")}</summary>` +
        `<div class="vitrine">` +
          (ex.file ? `<div class="file">${esc(ex.file)}</div>` : "") +
          `<pre>${(ex.code || "").split("\n").map(diffLine).join("\n")}</pre>` +
        `</div>` +
      `</details>`;
  }

  sec.innerHTML =
    `<h2 id="h-${i}">${esc(st.title || "")}</h2>` +
    `<div class="card"><p class="narration">${sentences}</p>${excerpt}</div>`;

  stationsEl.appendChild(sec);

  const dot = document.createElement("button");
  dot.type = "button";
  dot.textContent = String(i + 1).padStart(2, "0");
  dot.setAttribute("aria-label", `Station ${i + 1}: ${st.title || ""}`);
  dot.addEventListener("click", () => {
    sec.scrollIntoView({ block: "start" });
    if (listening) startStation(i);
  });
  railEl.appendChild(dot);
});

const sectionEls = Array.from(document.querySelectorAll(".station"));
const dotEls = Array.from(railEl.querySelectorAll("button"));

/* ---------- active station: visuals only --------------------- */

let active = 0;

function setActive(i) {
  if (i === active) return;
  active = i;
  sectionEls.forEach((el, n) => el.setAttribute("aria-current", String(n === i)));
  dotEls.forEach((el, n) => el.setAttribute("aria-current", String(n === i)));
}

const io = new IntersectionObserver(
  (entries) => {
    const hit = entries
      .filter((e) => e.isIntersecting)
      .sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0];
    if (hit) setActive(sectionEls.indexOf(hit.target));
  },
  { rootMargin: "-35% 0px -35% 0px", threshold: [0, 0.2, 0.6, 1] }
);
sectionEls.forEach((el) => io.observe(el));
setActive(-1);
setActive(0);

/* ---------- narration ----------------------------------------
   Two modes, one toggle. Listening drives the scroll; the
   observer above never speaks, so the two cannot fight.
   -------------------------------------------------------------- */

const synth = window.speechSynthesis;
const listenBtn = document.getElementById("listen");
const listenGlyph = document.getElementById("listen-glyph");
const listenLabel = document.getElementById("listen-label");

let listening = false;
let cursor = { station: 0, sentence: 0 };
let voice = null;
let gen = 0;            // cancel() fires onend on the killed utterance in some
                        // browsers; stale handlers must not advance the cursor

if (synth) {
  listenBtn.hidden = false;
  const pickVoice = () => {
    const all = synth.getVoices().filter((v) => /^en/i.test(v.lang));
    voice = all.find((v) => v.localService) || all[0] || null;
  };
  pickVoice();                                  // empty on first call in Chrome
  synth.addEventListener("voiceschanged", pickVoice);
}

function paint() {
  document.querySelectorAll(".narration .s.speaking").forEach((el) => el.classList.remove("speaking"));
  const sec = sectionEls[cursor.station];
  if (!sec) return;
  const span = sec.querySelector(`.s[data-s="${cursor.sentence}"]`);
  if (span) span.classList.add("speaking");
  const total = (stations[cursor.station].narration || []).length;
  sec.querySelector(".card").style.setProperty("--p", total ? (cursor.sentence + 1) / total : 0);
}

function speak() {
  if (!listening) return;
  const st = stations[cursor.station];
  if (!st) return stop();

  const lines = st.narration || [];
  if (cursor.sentence >= lines.length) {
    if (cursor.station + 1 >= stations.length) return stop();
    return startStation(cursor.station + 1);
  }

  paint();
  const mine = ++gen;
  synth.cancel();                               // a stacked queue is the whole bug
  const u = new SpeechSynthesisUtterance(lines[cursor.sentence]);
  if (voice) u.voice = voice;
  u.rate = 0.97;
  u.onend = () => {
    if (!listening || mine !== gen) return;
    cursor.sentence += 1;
    speak();
  };
  synth.speak(u);
}

function startStation(i) {
  gen++;
  cursor = { station: i, sentence: 0 };
  sectionEls[i].scrollIntoView({ block: "start" });
  speak();
}

function start() {
  listening = true;
  document.body.classList.add("listening");
  listenBtn.setAttribute("aria-pressed", "true");
  listenGlyph.innerHTML = "&#9632;";
  listenLabel.textContent = "Stop";
  startStation(active < 0 ? 0 : active);
}

function stop() {
  listening = false;
  document.body.classList.remove("listening");
  listenBtn.setAttribute("aria-pressed", "false");
  listenGlyph.innerHTML = "&#9654;";
  listenLabel.textContent = "Listen";
  gen++;
  if (synth) synth.cancel();
  document.querySelectorAll(".narration .s.speaking").forEach((el) => el.classList.remove("speaking"));
}

listenBtn.addEventListener("click", () => (listening ? stop() : start()));
window.addEventListener("beforeunload", () => synth && synth.cancel());
</script>
</body>
</html>
